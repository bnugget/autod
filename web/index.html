<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>autoD</title>
<style>
body{margin:0;background:#008080;display:flex;justify-content:center;padding:24px;font-family:Tahoma,Geneva,sans-serif}
.win98-raised{border-style:solid;border-width:2px;border-color:#fff #404040 #404040 #fff;background:#c0c0c0}
.win98-inset{border-style:solid;border-width:2px;border-color:#404040 #fff #fff #404040}
.win98-label{font-family:Tahoma,Geneva,sans-serif;font-size:11px;color:#000}
button{font-family:Tahoma,Geneva,sans-serif}
</style>
</head>
<body>
<div class="win98-raised" style="width:460px;padding:2px">
  <div style="background:#0a246a;color:#fff;font-size:12px;font-weight:bold;padding:4px 6px;display:flex;justify-content:space-between;align-items:center">
    <span>SYNC.EXE - AutoD Music Pipeline</span>
    <div style="display:flex;gap:2px" aria-hidden="true">
      <div class="win98-raised" style="width:16px;height:14px;text-align:center;line-height:14px;font-size:11px">_</div>
      <div class="win98-raised" style="width:16px;height:14px;text-align:center;line-height:14px;font-size:11px">&#9633;</div>
      <div class="win98-raised" style="width:16px;height:14px;text-align:center;line-height:14px;font-size:11px">X</div>
    </div>
  </div>
  <div style="background:#c0c0c0;padding:4px 6px;display:flex;gap:4px;border-bottom:1px solid #808080">
    <button id="sourceBtn" class="win98-raised win98-label" style="padding:2px 6px;cursor:pointer">SOURCE</button>
    <button id="browseBtn" class="win98-raised win98-label" style="padding:2px 6px;cursor:pointer">BROWSE</button>
    <button id="previewBtn" class="win98-raised win98-label" style="padding:2px 6px;cursor:pointer">PREVIEW</button>
    <button id="searchBtn" class="win98-raised win98-label" style="padding:2px 6px;cursor:pointer">SEARCH</button>
    <button id="manageBtn" class="win98-raised win98-label" style="padding:2px 6px;cursor:pointer">MENU</button>
  </div>
  <div style="background:#c0c0c0;padding:10px">
    <div class="win98-inset" style="background:#000;color:#00ff00;font-family:'Courier New',monospace;font-size:11px;padding:8px;height:170px;overflow-y:auto" id="logBox">C:\AUTOD&gt; ready, click SYNC to start</div>
    <div id="visualizerScreen" class="win98-inset" style="background:#000;display:none;height:170px;box-sizing:border-box;padding:6px">
      <div style="color:#00ff00;font-family:'Courier New',monospace;font-size:11px;display:flex;justify-content:space-between">
        <span id="trackName">(no track loaded)</span>
        <span id="trackTime">0:00 / 0:00</span>
      </div>
      <canvas id="visualizer" width="420" height="130" style="display:block;width:100%;height:130px;margin-top:2px"></canvas>
      <div id="seekBar" style="height:10px;background:#111;margin-top:4px;position:relative;cursor:pointer">
        <div id="seekFill" style="position:absolute;left:0;top:0;height:100%;background:#00ff00;width:0%"></div>
      </div>
    </div>
    <div class="win98-inset win98-label" style="background:#c0c0c0;padding:3px 6px;margin-top:4px" id="statusBar">Ready</div>
    <div id="searchForm" style="display:none;flex-direction:column;gap:4px;margin-top:6px">
      <input id="watchUrl" type="text" placeholder="1001tracklists URL" style="font-size:10px;padding:3px;width:100%;box-sizing:border-box">
      <div style="display:flex;gap:4px">
        <input id="watchTrackNum" type="number" placeholder="Track #" style="font-size:10px;padding:3px;width:60px">
        <input id="watchLabel" type="text" placeholder="Label (optional)" style="font-size:10px;padding:3px;flex:1">
        <button id="addWatchBtn" class="win98-raised win98-label" style="padding:3px 8px;cursor:pointer">ADD</button>
      </div>
    </div>
  </div>
  <div style="background:#c0c0c0;padding:0 10px 8px;display:flex;gap:4px;justify-content:center" aria-hidden="true">
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#e0435a">A</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#3aa0e0">B</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#7fd13a">C</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#c56fe0">D</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#3ad18b">E</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#e08a3a">F</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#4a6fe0">G</div>
    <div class="win98-raised win98-label" style="width:40px;height:36px;text-align:center;line-height:36px;font-weight:bold;background:#d1c93a">H</div>
  </div>
  <div style="background:#c0c0c0;padding:6px 16px 18px;display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="display:flex;gap:4px">
        <button id="seekBackBtn" class="win98-raised win98-label" style="width:24px;height:20px;font-size:9px;cursor:pointer" title="Skip back 10s">&#9664;&#9664;</button>
        <button id="seekFwdBtn" class="win98-raised win98-label" style="width:24px;height:20px;font-size:9px;cursor:pointer" title="Skip forward 10s">&#9654;&#9654;</button>
      </div>
      <div class="win98-raised win98-label" style="width:52px;height:52px;border-radius:50%;text-align:center;line-height:52px;font-weight:bold;color:#a05a00" aria-hidden="true">CUE</div>
      <button id="playBtn" class="win98-raised win98-label" style="width:52px;height:52px;border-radius:50%;font-weight:bold;color:#1a7a1a;cursor:pointer">PLAY</button>
    </div>
    <div style="position:relative;width:170px;height:170px;border-radius:50%;background:#3a3a3a;border:6px solid #1a1a1a;display:flex;align-items:center;justify-content:center;flex-shrink:0">
      <div style="position:absolute;width:144px;height:144px;border-radius:50%;border:2px solid #555;pointer-events:none"></div>
      <div style="position:absolute;width:118px;height:118px;border-radius:50%;border:2px solid #555;pointer-events:none"></div>
      <button id="syncBtn" class="win98-raised" style="width:80px;height:80px;border-radius:50%;font-weight:bold;font-size:15px;color:#000;letter-spacing:1px;cursor:pointer">SYNC</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px;align-items:center">
      <div style="display:flex;gap:4px" aria-hidden="true">
        <div class="win98-raised win98-label" style="width:34px;height:28px;text-align:center;line-height:28px;font-size:10px">IN</div>
        <div class="win98-raised win98-label" style="width:34px;height:28px;text-align:center;line-height:28px;font-size:10px">OUT</div>
      </div>
      <button id="downloadBtn" class="win98-raised win98-label" style="width:72px;height:24px;font-size:10px;cursor:pointer">DOWNLOAD</button>
      <div style="display:flex;gap:4px" aria-hidden="true">
        <div class="win98-raised win98-label" style="width:34px;height:28px;text-align:center;line-height:28px;font-size:10px">4</div>
        <div class="win98-raised win98-label" style="width:34px;height:28px;text-align:center;line-height:28px;font-size:10px">8</div>
      </div>
    </div>
  </div>
</div>
<script>
var BACKEND_URL = "https://autod-d25s.onrender.com";

var logBox = document.getElementById("logBox");
var visualizerScreen = document.getElementById("visualizerScreen");
var canvas = document.getElementById("visualizer");
var canvasCtx = canvas.getContext("2d");
var trackNameEl = document.getElementById("trackName");
var trackTimeEl = document.getElementById("trackTime");
var seekBar = document.getElementById("seekBar");
var seekFill = document.getElementById("seekFill");
var statusBar = document.getElementById("statusBar");

var syncBtn = document.getElementById("syncBtn");
var browseBtn = document.getElementById("browseBtn");
var sourceBtn = document.getElementById("sourceBtn");
var previewBtn = document.getElementById("previewBtn");
var searchBtn = document.getElementById("searchBtn");
var manageBtn = document.getElementById("manageBtn");
var playBtn = document.getElementById("playBtn");
var seekBackBtn = document.getElementById("seekBackBtn");
var seekFwdBtn = document.getElementById("seekFwdBtn");
var downloadBtn = document.getElementById("downloadBtn");
var searchForm = document.getElementById("searchForm");
var watchUrlInput = document.getElementById("watchUrl");
var watchTrackNumInput = document.getElementById("watchTrackNum");
var watchLabelInput = document.getElementById("watchLabel");
var addWatchBtn = document.getElementById("addWatchBtn");

var pollTimer = null;
var viewMode = "log";
var lastState = null;
var currentFiles = [];
var selectedIndices = new Set();
var nowPlaying = null;

var audio = new Audio();
audio.crossOrigin = "anonymous";
var audioCtx = null;
var analyser = null;
var animId = null;

function formatSize(bytes) {
  if (!bytes) return "";
  return (Number(bytes) / (1024 * 1024)).toFixed(1) + " MB";
}

function formatTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return m + ":" + (s < 10 ? "0" : "") + s;
}

function showScreen(mode) {
  viewMode = mode;
  logBox.style.display = (mode === "log" || mode === "browse" || mode === "search" || mode === "manage") ? "block" : "none";
  visualizerScreen.style.display = mode === "visualizer" ? "block" : "none";
  searchForm.style.display = mode === "search" ? "flex" : "none";
  if (mode === "visualizer") startVisualizerLoopIfNeeded();
  else stopVisualizer();
}

function renderLog(state) {
  if (state && state.log && state.log.length) {
    logBox.innerHTML = state.log.map(function (entry) { return entry.text; }).join("<br>");
    logBox.scrollTop = logBox.scrollHeight;
  } else {
    logBox.innerHTML = "C:\\AUTOD&gt; ready, click SYNC to start";
  }
}

function renderFiles(files) {
  currentFiles = files;
  if (!files.length) {
    logBox.innerHTML = "C:\\DRIVE&gt; no files found in the folder yet";
    return;
  }
  var lines = files.map(function (f, idx) {
    var size = formatSize(f.size);
    var date = f.modifiedTime ? f.modifiedTime.slice(0, 10) : "";
    var check = '<input type="checkbox" class="fileCheck" data-idx="' + idx + '"' +
      (selectedIndices.has(idx) ? " checked" : "") + ' style="accent-color:#00ff00;margin-right:4px">';
    var name = '<a href="#" data-idx="' + idx + '" class="playLink" style="color:#00ff00;text-decoration:underline;cursor:pointer">' + f.name + "</a>";
    return check + name + "&nbsp;&nbsp;" + size + "&nbsp;&nbsp;" + date;
  });
  logBox.innerHTML = "C:\\DRIVE&gt; dir<br><br>" + lines.join("<br>") + "<br><br>" + files.length + " file(s)";

  logBox.querySelectorAll(".playLink").forEach(function (link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      loadTrack(currentFiles[Number(link.getAttribute("data-idx"))]);
    });
  });

  logBox.querySelectorAll(".fileCheck").forEach(function (check) {
    check.addEventListener("change", function () {
      var idx = Number(check.getAttribute("data-idx"));
      if (check.checked) selectedIndices.add(idx); else selectedIndices.delete(idx);
    });
  });
}

function renderWatches(watches) {
  if (!watches.length) {
    logBox.innerHTML = "C:\\WATCH&gt; no watches yet, add one below";
    return;
  }
  var lines = watches.map(function (w) {
    var status = w.lastError
      ? "error: " + w.lastError
      : w.changed
        ? "CHANGED -&gt; " + w.currentValue
        : "watching: " + w.currentValue;
    var remove = '<a href="#" data-id="' + w.id + '" class="removeWatch" style="color:#ff6666">[remove]</a>';
    return "#" + w.trackNumber + " " + (w.label || w.url) + "<br>" + status + "&nbsp;&nbsp;" + remove;
  });
  logBox.innerHTML = "C:\\WATCH&gt; tracking " + watches.length + " track(s)<br><br>" + lines.join("<br><br>");

  logBox.querySelectorAll(".removeWatch").forEach(function (link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      fetch(BACKEND_URL + "/api/watches/" + link.getAttribute("data-id"), { method: "DELETE" })
        .then(loadWatchesUI);
    });
  });
}

function loadWatchesUI() {
  logBox.innerHTML = "C:\\WATCH&gt; loading...";
  fetch(BACKEND_URL + "/api/watches")
    .then(function (res) { return res.json(); })
    .then(function (data) { renderWatches(data.watches || []); })
    .catch(function () { logBox.innerHTML = "C:\\WATCH&gt; could not reach the backend"; });
}

function loadTrack(file) {
  nowPlaying = file.name;
  trackNameEl.textContent = nowPlaying;
  audio.src = BACKEND_URL + "/api/stream/" + file.id;
  audio.play();
}

function updateProgressUI() {
  var duration = audio.duration || 0;
  var current = audio.currentTime || 0;
  trackTimeEl.textContent = formatTime(current) + " / " + formatTime(duration);
  seekFill.style.width = (duration ? (current / duration) * 100 : 0) + "%";
}

function setupAnalyser() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var sourceNode = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 64;
  sourceNode.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function startVisualizerLoopIfNeeded() {
  if (viewMode === "visualizer" && !audio.paused && analyser && !animId) drawVisualizer();
}

function drawVisualizer() {
  var freqData = new Uint8Array(analyser.frequencyBinCount);
  var timeData = new Uint8Array(analyser.fftSize);
  var rayCount = 56;

  function draw() {
    animId = requestAnimationFrame(draw);
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    var w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
    var now = performance.now();

    canvasCtx.fillStyle = "#000";
    canvasCtx.fillRect(0, 0, w, h);

    canvasCtx.save();
    canvasCtx.shadowBlur = 5;
    canvasCtx.shadowColor = "#00ff77";
    for (var i = 0; i < rayCount; i++) {
      var angle = (i / rayCount) * Math.PI * 2;
      var mag = freqData[i % freqData.length] / 255;
      var length = mag * Math.max(w, h) * 0.95 + 6;
      var segments = 5;
      canvasCtx.beginPath();
      canvasCtx.moveTo(cx, cy);
      for (var s = 1; s <= segments; s++) {
        var t = s / segments;
        var dist = length * t;
        var wobble = Math.sin(t * 6 + i * 0.7 + now / 250) * 3 * mag;
        var px = cx + Math.cos(angle) * dist + Math.cos(angle + Math.PI / 2) * wobble;
        var py = cy + Math.sin(angle) * dist * (h / w) + Math.sin(angle + Math.PI / 2) * wobble * (h / w);
        canvasCtx.lineTo(px, py);
      }
      canvasCtx.strokeStyle = "rgba(60,255,140," + (0.1 + mag * 0.6) + ")";
      canvasCtx.lineWidth = 1;
      canvasCtx.stroke();
    }
    canvasCtx.restore();

    canvasCtx.save();
    canvasCtx.shadowBlur = 6;
    canvasCtx.shadowColor = "#00ff99";
    canvasCtx.strokeStyle = "#a8ffcc";
    canvasCtx.lineWidth = 1.5;
    canvasCtx.beginPath();
    var sliceWidth = w / timeData.length;
    for (var j = 0; j < timeData.length; j++) {
      var v = (timeData[j] - 128) / 128;
      var y = cy + v * (h * 0.38);
      var x = j * sliceWidth;
      if (j === 0) canvasCtx.moveTo(x, y); else canvasCtx.lineTo(x, y);
    }
    canvasCtx.stroke();
    canvasCtx.restore();
  }
  draw();
}

function stopVisualizer() {
  if (animId) cancelAnimationFrame(animId);
  animId = null;
}

function applyStatusBar(state) {
  if (state && state.running) {
    if (state.progress) {
      statusBar.textContent = "Batch " + state.progress.batch + "/" + state.progress.totalBatches +
        " - " + state.progress.processed + "/" + state.progress.batchSize + " processed";
    } else {
      statusBar.textContent = "Starting...";
    }
    return;
  }
  if (nowPlaying) {
    statusBar.textContent = (audio.paused ? "Paused: " : "Now playing: ") + nowPlaying;
    return;
  }
  if (state && state.summary && state.summary.error) {
    statusBar.textContent = "Last run failed: " + state.summary.error;
  } else if (state && state.summary) {
    statusBar.textContent = "Last run: " + state.summary.downloaded + " of " + state.summary.sent +
      " downloaded, " + state.summary.uploaded + " of " + state.summary.sent + " uploaded";
  } else {
    statusBar.textContent = "Ready";
  }
}

function renderState(state) {
  lastState = state;
  if (viewMode === "log") renderLog(state);
  applyStatusBar(state);
  if (!state.running && pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function poll() {
  fetch(BACKEND_URL + "/api/status")
    .then(function (res) { return res.json(); })
    .then(renderState)
    .catch(function () {});
}

audio.addEventListener("play", function () {
  setupAnalyser();
  if (audioCtx.state === "suspended") audioCtx.resume();
  startVisualizerLoopIfNeeded();
  applyStatusBar(lastState);
});

audio.addEventListener("pause", function () {
  stopVisualizer();
  applyStatusBar(lastState);
});

audio.addEventListener("timeupdate", updateProgressUI);
audio.addEventListener("loadedmetadata", updateProgressUI);

playBtn.addEventListener("click", function () {
  if (!audio.src) return;
  if (audio.paused) audio.play(); else audio.pause();
});

seekBackBtn.addEventListener("click", function () {
  if (!audio.src) return;
  audio.currentTime = Math.max(0, (audio.currentTime || 0) - 10);
});

seekFwdBtn.addEventListener("click", function () {
  if (!audio.src) return;
  audio.currentTime = Math.min(audio.duration || audio.currentTime, (audio.currentTime || 0) + 10);
});

seekBar.addEventListener("click", function (e) {
  if (!audio.duration) return;
  var rect = seekBar.getBoundingClientRect();
  audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
});

syncBtn.addEventListener("click", function () {
  if (pollTimer) return;
  showScreen("log");
  logBox.innerHTML = "waking up the backend, this can take up to a minute on the first click...";
  statusBar.textContent = "Starting...";

  fetch(BACKEND_URL + "/api/sync", { method: "POST" })
    .then(function () {
      pollTimer = setInterval(poll, 2000);
      poll();
    })
    .catch(function () {
      statusBar.textContent = "Could not reach the backend";
    });
});

browseBtn.addEventListener("click", function () {
  showScreen("browse");
  selectedIndices.clear();
  logBox.innerHTML = "C:\\DRIVE&gt; loading file list...";
  fetch(BACKEND_URL + "/api/files")
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.error) {
        logBox.innerHTML = "C:\\DRIVE&gt; error: " + data.error;
        return;
      }
      renderFiles(data.files);
    })
    .catch(function () {
      logBox.innerHTML = "C:\\DRIVE&gt; could not reach the backend";
    });
});

sourceBtn.addEventListener("click", function () {
  showScreen("log");
  renderLog(lastState);
});

searchBtn.addEventListener("click", function () {
  showScreen("search");
  logBox.innerHTML = "C:\\WATCH&gt; enter a URL and track number below, then click ADD";
});

manageBtn.addEventListener("click", function () {
  showScreen("manage");
  loadWatchesUI();
});

addWatchBtn.addEventListener("click", function () {
  var url = watchUrlInput.value.trim();
  var trackNumber = watchTrackNumInput.value.trim();
  var label = watchLabelInput.value.trim();
  if (!url || !trackNumber) {
    statusBar.textContent = "Enter a URL and track number";
    return;
  }
  statusBar.textContent = "Adding watch...";
  fetch(BACKEND_URL + "/api/watches", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url: url, trackNumber: Number(trackNumber), label: label }),
  })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.error) {
        statusBar.textContent = "Error: " + data.error;
        return;
      }
      var addedLabel = label || url;
      watchUrlInput.value = "";
      watchTrackNumInput.value = "";
      watchLabelInput.value = "";
      statusBar.textContent = "Watch added";
      logBox.innerHTML = "C:\\WATCH&gt; added track " + trackNumber + " (" + addedLabel + ")<br><br>check MENU to view all watches";
    })
    .catch(function () {
      statusBar.textContent = "Could not reach the backend";
    });
});

previewBtn.addEventListener("click", function () {
  showScreen("visualizer");
  updateProgressUI();
});

downloadBtn.addEventListener("click", function () {
  if (selectedIndices.size === 0) {
    statusBar.textContent = "Select file(s) in browse first";
    return;
  }
  Array.from(selectedIndices).forEach(function (idx, i) {
    var file = currentFiles[idx];
    setTimeout(function () {
      if (file && file.webContentLink) window.open(file.webContentLink, "_blank");
    }, i * 400);
  });
});

poll();
</script>
</body>
</html>
